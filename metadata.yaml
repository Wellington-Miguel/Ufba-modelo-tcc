# --- Resumo em Língua Vernácula (Português) ---
# Conforme recomendação do Manual EDUFBA (6ª ed., p. 56 e 64), a referência bibliográfica
# do próprio trabalho é incluída automaticamente no cabeçalho do Resumo pelo compilador.
resumo: |
  Este trabalho apresenta uma proposta metodológica e prática para a escrita estruturada de Trabalhos de Conclusão de Curso (TCC) na Universidade Federal da Bahia (UFBA), aliando o potencial de Modelos de Linguagem de Grande Porte (LLMs) à conformidade das normas técnicas da ABNT. A divisão do texto em blocos modulares em formato Markdown soluciona limitações de contexto e coesão das inteligências artificiais, permitindo refinamentos incrementais sem desconfigurar o documento final. Um pipeline em Python traduz automaticamente esses blocos para o abnTeX2, garantindo precisão em margens, paginação, citações, numeração progressiva e elementos pré e pós-textuais. Os resultados demonstram agilidade na escrita, facilidade de versionamento e aderência integral às diretrizes acadêmicas da UFBA.
palavras_chave:
  - Trabalho de Conclusão de Curso
  - Modelos de Linguagem
  - ABNT UFBA
  - abnTeX2
  - Escrita Científica

# --- Resumo em Língua Estrangeira (Inglês) ---
abstract: |
  This work presents a methodological and practical proposal for structured writing of Undergraduate Final Projects (TCC) at the Federal University of Bahia (UFBA), combining the potential of Large Language Models (LLMs) with compliance to ABNT technical standards. Dividing the manuscript into modular Markdown blocks overcomes AI context and cohesion limitations, enabling incremental refinement without compromising document structure. A Python pipeline automatically translates these blocks into abnTeX2, ensuring accuracy in margins, pagination, citations, section numbering, and pre/post-textual elements. The results demonstrate increased writing agility, simplified version control, and full adherence to UFBA academic publishing standards.
keywords:
  - Undergraduate Thesis
  - Large Language Models
  - ABNT Standards
  - abnTeX2
  - Scientific Writing


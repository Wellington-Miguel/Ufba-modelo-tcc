# --- Resumo em Língua Vernácula (Português) ---
resumo: |
  Este trabalho propõe o desenvolvimento de um Assistente de Observabilidade Sociotécnica para o CorText Manager, uma plataforma consolidada de análise de dados para as ciências sociais e humanidades. Diante da extrema heterogeneidade das bases documentais externas submetidas pelos usuários, a etapa inicial de importação e padronização (Data Parsing) impõe desafios naturais de estruturação. Para preservar a estabilidade do ambiente compartilhado e a usabilidade para pesquisadores sem formação em programação, o sistema encapsula rotinas de tratamento de exceções e validação, operando funcionalmente como uma "caixa preta" latouriana. Contudo, quando arquivos brutos apresentam anomalias severas de formatação ou codificação, esse encapsulamento protetor dificulta o autodiagnóstico pelo usuário, gerando alta demanda de suporte manual à equipe mantenedora. Para mitigar essa fricção de dados sem alterar a arquitetura nativa da plataforma, propõe-se uma ferramenta auxiliar baseada em Qualidade de Dados (Data Profiling) e Recuperação Aumentada por Geração (RAG) executada localmente. O assistente atua de forma preventiva e reativa, inspecionando inconsistências estruturais nos arquivos antes da submissão e traduzindo registros técnicos de execução em orientações metodológicas acionáveis, ancoradas na documentação oficial e nas resoluções históricas da própria equipe no fórum. A auditoria censitária do fórum demonstra que dúvidas associadas à preparação e ingestão de dados motivam 66,4% dos chamados. Conclui-se que o assistente promove uma mediação transparente dessa infraestrutura, fortalecendo a autonomia diagnóstica do pesquisador e colaborando para desonerar o suporte técnico da plataforma.

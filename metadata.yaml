  - CorText Manager
  - Observabilidade Sociotécnica
  - Qualidade de Dados
  - Recuperação Aumentada por Geração
  - Estudos de Ciência e Tecnologia

# --- Resumo em Língua Estrangeira (Inglês) ---
abstract: |
  This work proposes the development of a Sociotechnical Observability Assistant for CorText Manager, a consolidated data analysis platform for the social sciences and humanities. Given the extreme heterogeneity of external documentary databases submitted by users, the initial stage of data importation and standardization (Data Parsing) poses natural structuring challenges. To preserve the stability of the shared environment and usability for researchers without a programming background, the system encapsulates exception handling and validation routines, functionally operating as a Latourian "black box". However, when raw files present severe formatting or encoding anomalies, this protective encapsulation hinders self-diagnosis by the user, generating a high demand for manual support from the maintaining team. To mitigate this data friction without altering the platform's native architecture, an auxiliary tool based on Data Quality (Data Profiling) and locally executed Retrieval-Augmented Generation (RAG) is proposed. The assistant acts preventively and reactively, inspecting structural inconsistencies in files prior to submission and translating technical execution logs into actionable methodological guidance, anchored in the official documentation and the team's historical resolutions on the forum. A census audit of the support forum demonstrates that questions associated with data preparation and ingestion motivate 66.4% of tickets. It is concluded that the assistant promotes a transparent mediation of this infrastructure, strengthening the researcher's diagnostic autonomy and collaborating to relieve the platform's technical support.
keywords:
  - CorText Manager
  - Sociotechnical Observability
  - Data Quality
  - Retrieval-Augmented Generation
  - Science and Technology Studies


# --- Resumo em Língua Vernácula (Português) ---
resumo: |
  Este trabalho propõe o desenvolvimento de um Assistente de Observabilidade Sociotécnica para o CorText Manager, uma plataforma de análise de dados para ciências sociais. A etapa inicial de importação de dados (Data Parsing) frequentemente atua como uma "caixa preta" latouriana: suas heurísticas de correção e truncamento silencioso de dados, necessárias para a estabilidade do servidor, tornam-se opacas ao pesquisador, escondendo vieses metodológicos e perdas de informações críticas. Para mitigar essa fricção técnica sem alterar a arquitetura nativa da plataforma, propõe-se uma solução baseada em Qualidade de Dados (Data Profiling) e Recuperação Aumentada por Geração (RAG). O sistema atua de forma preventiva e reativa, auditando anomalias de formatação antes da submissão e traduzindo logs de erro opacos em diagnósticos acionáveis, ancorados na base de conhecimento oficial. Resultados da auditoria do fórum de suporte evidenciam que problemas de infraestrutura de dados afetam 66,4% dos chamados. O assistente promove a abertura seletiva dessa infraestrutura invisível, devolvendo a agência metodológica ao usuário e preservando o rigor epistêmico das pesquisas.
palavras_chave:
  - CorText Manager
  - Observabilidade Sociotécnica
  - Qualidade de Dados
  - Recuperação Aumentada por Geração
  - Estudos de Ciência e Tecnologia

# --- Resumo em Língua Estrangeira (Inglês) ---
abstract: |
  This work proposes the development of a Sociotechnical Observability Assistant for CorText Manager, a data analysis platform for social sciences. The initial data importation stage (Data Parsing) frequently acts as a Latourian "black box": its heuristics for correction and silent data truncation, necessary for server stability, become opaque to the researcher, hiding methodological biases and critical information losses. To mitigate this technical friction without altering the platform's native architecture, a solution based on Data Quality (Data Profiling) and Retrieval-Augmented Generation (RAG) is proposed. The system acts preventively and reactively, auditing formatting anomalies before submission and translating opaque error logs into actionable diagnoses, anchored in the official knowledge base. Results from the support forum audit show that data infrastructure problems affect 66.4% of tickets. The assistant promotes the selective opening of this invisible infrastructure, returning methodological agency to the user and preserving the epistemic rigor of the research.
keywords:
  - CorText Manager
  - Sociotechnical Observability
  - Data Quality
  - Retrieval-Augmented Generation
  - Science and Technology Studies

